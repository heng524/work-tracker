name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install nativefier
      run: npm install -g nativefier

    - name: Build APK using Nativefier
      run: |
        nativefier --name "WorkTracker" --platform android --arch arm64 --counter --maximize ./ "output-app"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WorkTracker-APK
        path: output-app/**/*.apk
